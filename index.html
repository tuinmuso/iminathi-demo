<!doctype html>
<html lang="af"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f3ef">
<meta property="og:title" content="Iminathi Veilingkatalogus">
<meta property="og:description" content="Iminathi Ranch 2de Produksieveiling, 28 Nov 2026, Silverlakes. Demo van die katalogus-app.">
<title>Iminathi Veilingkatalogus</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: mobile-first stud catalogue. Lot cards as a reel-like feed, detail sheet slides up, bottom tab bar. */
:root{
  /* Iminathi brand: logo black, sage ring, protea pink, white bull */
  --bg:#f4f3ef; --surface:#ffffff; --sunk:#e9ece7; --fg:#1f2421; --muted:#5d6961; --line:#d5dad3;
  --earth:#b4604c; --earth-ink:#fff; --protea:#de9f90; --sage:#7a877d; --night:#141615; --night-fg:#f2f4f0;
  --sky1:#ecc3b6; --sky2:#9aa89c; --hill:#56635a; --hill2:#2f3833;
  --good:#3b7a4a; --warn:#a8721a;
  --display:"Jost","Futura","Century Gothic",sans-serif; --body:"Figtree",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111312; --surface:#1a1d1b; --sunk:#242825; --fg:#ecefe9; --muted:#9ba69e; --line:#2f3531;
  --earth:#e7ab9c; --earth-ink:#1d1210; --protea:#de9f90; --sage:#9fada3; --night:#1a1d1b; --night-fg:#f2f4f0;
  --sky1:#7a5249; --sky2:#3e4a42; --hill:#262e29; --hill2:#151a17;
  --good:#7fc28e; --warn:#e2b04a; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111312; --surface:#1a1d1b; --sunk:#242825; --fg:#ecefe9; --muted:#9ba69e; --line:#2f3531;
  --earth:#e7ab9c; --earth-ink:#1d1210; --protea:#de9f90; --sage:#9fada3; --night:#1a1d1b; --night-fg:#f2f4f0;
  --sky1:#7a5249; --sky2:#3e4a42; --hill:#262e29; --hill2:#151a17;
  --good:#7fc28e; --warn:#e2b04a; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 110px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--earth);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.brand{display:flex;flex-direction:column}
.brand small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.brand b{font-family:var(--display);font-size:21px;font-weight:600;line-height:1.1}
.brand img{width:44px;height:auto}
.brand-row{display:flex;align-items:center;gap:10px}
.logo-l{display:block}.logo-d{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-l{display:none}:root:not([data-theme="light"]) .logo-d{display:block}}
:root[data-theme="dark"] .logo-l{display:none}:root[data-theme="dark"] .logo-d{display:block}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex-shrink:0}
.lang button{border:0;background:none;padding:6px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.demo{font-size:12px;background:var(--sunk);color:var(--muted);border-radius:8px;padding:7px 10px;margin-bottom:14px}

.hero{background:#ffffff;color:#1f2421;border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.hero .logo{width:118px;height:auto;display:block}
.hero h1{font-size:15px;line-height:1.25;letter-spacing:.16em;text-transform:uppercase;font-weight:500;color:#b4604c}
.hero p{margin:6px 0 10px;font-size:14px;opacity:.85}
.hero .count{text-align:left;display:flex;align-items:baseline;gap:8px;border-top:1px solid #dde2db;padding-top:10px}
@media (max-width:380px){.hero{grid-template-columns:1fr}.hero .logo{width:140px}}
.count b{font-family:var(--display);font-size:38px;font-weight:600;line-height:1}
.count span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:#6a776d}

.hog{display:flex;gap:10px;align-items:flex-end;margin:14px 0 4px}
.hog img{width:96px;height:auto;flex-shrink:0;margin-bottom:-4px}
.bubble{margin-bottom:18px}
.empty img{width:110px;display:block;margin:0 auto 8px}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:10px 12px;font-size:14px}
.bubble b{display:block;font-size:12px;font-family:var(--display);color:var(--earth);letter-spacing:.06em;text-transform:uppercase}

.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}

/* lot cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:8px}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.vid{position:relative;aspect-ratio:4/5;max-width:100%;background:linear-gradient(180deg,var(--sky1),var(--sky2) 62%);overflow:hidden;border:0;padding:0;width:100%;text-align:left;display:block}
.card .vid{aspect-ratio:16/11}
.vid::before{content:"";position:absolute;inset:auto -10% 0 -10%;height:46%;background:var(--hill);border-radius:60% 40% 0 0 / 70% 60% 0 0}
.vid::after{content:"";position:absolute;inset:auto -20% 0 30%;height:30%;background:var(--hill2);border-radius:50% 50% 0 0 / 80% 80% 0 0}
.vid .lotno{position:absolute;left:12px;top:10px;z-index:2;font-family:var(--display);font-weight:700;color:#fff;font-size:15px;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.vid .play{position:absolute;inset:0;margin:auto;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.92);z-index:2;display:grid;place-items:center}
.vid .play::after{content:"";border-left:16px solid #2a2618;border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:4px}
.vid .tag{position:absolute;right:10px;top:10px;z-index:2;background:rgba(0,0,0,.55);color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;padding:4px 8px;border-radius:6px}
.vid .tag.live{background:#c2341b}
.vid .tag.sold{background:#2f6b2d}
.vid.playing .play{opacity:0}
.vid .bar{position:absolute;left:0;bottom:0;height:4px;background:#fff;z-index:3;width:0}
.vid.playing .bar{animation:prog 6s linear forwards}
.vid .cap{position:absolute;left:12px;right:12px;bottom:14px;z-index:3;color:#fff;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s}
.vid.playing .cap{opacity:1}
@keyframes prog{to{width:100%}}
@media (prefers-reduced-motion:reduce){.vid.playing .bar{animation:none;width:100%}}

.cbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.crow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cname{font-family:var(--display);font-size:20px;font-weight:600;line-height:1.15}
.cid{font-size:12px;color:var(--muted)}
.heart{border:1px solid var(--line);background:none;border-radius:999px;width:40px;height:40px;display:grid;place-items:center;flex-shrink:0}
.heart svg{width:20px;height:20px;fill:none;stroke:var(--fg);stroke-width:2}
.heart[aria-pressed="true"]{background:var(--earth);border-color:var(--earth)}
.heart[aria-pressed="true"] svg{fill:var(--earth-ink);stroke:var(--earth-ink)}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.stat{background:var(--sunk);border-radius:8px;padding:4px 9px;font-size:13px}
.stat i{font-style:normal;color:var(--muted);font-size:11px;display:block;letter-spacing:.06em;text-transform:uppercase}
.watch{font-size:13px;color:var(--earth);font-weight:600;display:flex;align-items:center;gap:6px}
.watch::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--earth)}
.sold-line{font-family:var(--display);font-size:18px;font-weight:700;color:var(--good)}
.open{margin-top:auto;border:0;background:var(--fg);color:var(--bg);border-radius:10px;padding:11px;font-weight:700}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,16,8,.55);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;z-index:21;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.sheet-in{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0;display:flex;flex-direction:column;gap:16px}
.grab{display:flex;justify-content:space-between;align-items:center}
.close{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:13px}
.sheet .vid{border-radius:14px;aspect-ratio:16/11}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.sec h3{font-size:17px}
.sec .hint{font-size:12px;color:var(--muted);margin:-6px 0 0}
.ped{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ped div{background:var(--sunk);border-radius:10px;padding:8px 10px;font-size:13px;min-width:0}
.ped i{font-style:normal;display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.ped .full{grid-column:1/-1}
textarea,input[type=text]{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:10px;font:inherit;resize:vertical}
.saved{font-size:12px;color:var(--good);min-height:16px}
.qa{display:flex;flex-direction:column;gap:10px}
.q{border-left:3px solid var(--line);padding-left:10px;font-size:14px}
.q b{font-weight:600}
.q .a{margin-top:4px;color:var(--fg)}
.q .a span{color:var(--earth);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-right:6px}
.q .pend{margin-top:4px;color:var(--warn);font-size:12px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px}
.btn.primary{background:var(--earth);border-color:var(--earth);color:var(--earth-ink)}
.btn.wa{background:#1f8a4c;border-color:#1f8a4c;color:#fff}
.sharebox{font-size:13px;background:var(--sunk);padding:10px;border-radius:10px;word-break:break-word}

/* compare tray + table */
.tray{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tray button{background:var(--fg);color:var(--bg);border:0;border-radius:999px;padding:11px 18px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.ctable{width:100%;border-collapse:collapse;font-size:14px}
.ctable th,.ctable td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.ctable th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700;width:30%}
.ctable td{font-variant-numeric:tabular-nums}
.ctable td.win{color:var(--good);font-weight:700}

/* sale night */
.live{background:var(--surface);border:2px solid #c2341b;border-radius:16px;overflow:hidden}
.live .vid{aspect-ratio:16/9}
.live .in{padding:14px;display:flex;flex-direction:column;gap:8px}
.pulse{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#c2341b}
.pulse::before{content:"";width:10px;height:10px;border-radius:50%;background:#c2341b;animation:pu 1.2s infinite}
@keyframes pu{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pulse::before{animation:none}}
.bid{font-family:var(--display);font-size:34px;font-weight:700;line-height:1}
.results{display:flex;flex-direction:column;margin-top:6px}
.res{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.res .n{font-family:var(--display);font-weight:700;color:var(--muted)}
.res .p{font-weight:700;color:var(--good)}
.res .p.wait{color:var(--muted);font-weight:500}
.meerkat{display:block;text-align:center;text-decoration:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:12px;font-weight:700}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font-family:var(--display);font-size:28px;line-height:1}
.kpi span{font-size:12px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:10px}
.barrow{display:grid;grid-template-columns:minmax(0,120px) 1fr 34px;gap:10px;align-items:center;font-size:13px}
.barrow .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:10px;background:var(--sunk);border-radius:6px;overflow:hidden}
.fill{height:100%;background:var(--earth);border-radius:6px}
.topq li{margin-bottom:6px}
.empty{text-align:center;color:var(--muted);padding:30px 10px;background:var(--surface);border:1px dashed var(--line);border-radius:14px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:16;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{border:0;background:none;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
.nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8}
.nav button[aria-current="page"]{color:var(--earth)}
.nav .badge{background:var(--earth);color:var(--earth-ink);border-radius:999px;font-size:10px;padding:0 5px;margin-left:2px}
.secthead{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 10px}
.secthead h2{font-size:22px;font-weight:600}
.secthead span{font-size:13px;color:var(--muted)}
</style>
</head><body>

function vid(l,opts={}){
  let tag="";
  if(S.tab==="live"||opts.live){ if(l.sold) tag=`<span class="tag sold">${esc(t("soldFor")).toUpperCase()}</span>`; else if(l.live) tag=`<span class="tag live">LIVE</span>`;}
  else tag=`<span class="tag">${esc(T[S.lang].cat[l.cat]).toUpperCase()}</span>`;
  return `<button class="vid" data-play aria-label="Play video, Lot ${l.lot}"><span class="lotno">LOT ${l.lot}</span>${tag}<span class="play"></span><span class="cap">${esc(t("playCap"))}</span><span class="bar"></span></button>`;
}
function card(l){
  const fav=S.fav.includes(l.lot);
  return `<article class="card">${vid(l)}<div class="cbody">
   <div class="crow"><div><div class="cname">${esc(l.name)}</div><div class="cid mono">${esc(l.id)}</div></div>
   <button class="heart" data-fav="${l.lot}" aria-pressed="${fav}" aria-label="Shortlist">${heartSvg}</button></div>
   <div class="stats"><span class="stat"><i>${t("age")}</i>${esc(l.age)}</span><span class="stat"><i>${t("weight")}</i><span class="mono">${esc(l.w)}</span></span><span class="stat"><i>${t("status")}</i>${esc(stTxt(l))}</span></div>
   <div class="watch">${esc(t("watching")(watchers(l)))}</div>
   <button class="open" data-open="${l.lot}">${esc(t("view"))}</button></div></article>`;
}
function catalogue(){
  const d=daysLeft();
  const f=S.filter;
  const lots=LOTS.filter(l=>f==="all"||(f==="mine"?S.fav.includes(l.lot):l.cat===f));
  const chips=["all","bull","preg","cwc","mine"].map(k=>`<button class="chip" data-filter="${k}" aria-pressed="${f===k}">${esc(t(k))}</button>`).join("");
  return `<section class="hero"><img class="logo" src="${LOGO_W}" alt="Iminathi Ranch, Waterberg"><div><h1>${esc(t("auction"))}</h1><p>${esc(t("where"))}</p>
    <div class="count"><b class="mono">${d||"0"}</b><span>${esc(d?t("days"):t("tonight"))}</span></div></div></section>
   <div class="hog"><img src="${HOG}" alt="Die Iminathi vlakvark"><div class="bubble"><b>${esc(t("hogName"))}</b>${esc(t("hogMsg"))}</div></div>
   <div class="chips" role="group">${chips}</div>
   ${lots.length?`<div class="grid">${lots.map(card).join("")}</div>`:`<div class="empty"><img src="${HOG}" alt="">${esc(t("listEmpty"))}</div>`}`;
}
function myList(){
  const lots=LOTS.filter(l=>S.fav.includes(l.lot));
  return `<div class="secthead"><h2>${esc(t("listTitle"))}</h2><span>${lots.length}</span></div>
   ${lots.length?`<div class="grid">${lots.map(card).join("")}</div>`:`<div class="empty"><img src="${HOG}" alt="">${esc(t("listEmpty"))}</div>`}`;
}
function live(){
  const cur=LOTS.find(l=>l.live);
  const rows=LOTS.map(l=>`<div class="res"><span class="n">LOT ${l.lot}</span><span>${esc(l.name)}<br><small class="mono" style="color:var(--muted)">${esc(l.id)}</small></span>
    <span class="p ${l.sold?"":"wait"}">${l.sold?esc(l.sold):(l.live?'<span class="pulse">LIVE</span>':esc(t("next")))}</span></div>`).join("");
  return `<div class="secthead"><h2>${esc(t("liveTitle"))}</h2><span>${esc(t("liveNote"))}</span></div>
   <section class="live">${vid(cur,{live:true})}<div class="in"><span class="pulse">${esc(t("onBlock"))}</span>
    <div class="crow"><div><div class="cname">Lot ${cur.lot} · ${esc(cur.name)}</div><div class="cid mono">${esc(cur.id)} · ${esc(cur.sire)}</div></div></div>
    <div><small style="color:var(--muted)">${esc(t("currentBid"))}</small><div class="bid mono" id="bid">R210 000</div></div>
    <a class="meerkat" href="https://auctions.meerkatonline.co.za/" target="_blank" rel="noopener">${esc(t("bidOnline"))}</a></div></section>
   <div class="secthead" style="margin-top:20px"><h2>${esc(t("results"))}</h2></div><div class="results">${rows}</div>`;
}
function dash(){
  const sorted=[...LOTS].sort((a,b)=>watchers(b)-watchers(a));
  const max=watchers(sorted[0]);
  const bars=sorted.map(l=>`<div class="barrow"><span class="lbl">Lot ${l.lot} · ${esc(l.name)}</span><div class="track"><div class="fill" style="width:${watchers(l)/max*100}%"></div></div><span class="mono">${watchers(l)}</span></div>`).join("");
  const qs=S.lang==="af"?["Is daar semen saam met die bulle?","Watter bul het die verse gedek?","Kan ek voor die tyd kom kyk?","Hoe werk aanlyn bie?"]:["Does semen come with the bulls?","Which bull covered the heifers?","Can I view before the sale?","How does online bidding work?"];
  return `<div class="secthead"><h2>${esc(t("dashTitle"))}</h2></div><p style="margin:-4px 0 12px;color:var(--muted);font-size:13px">${esc(t("dashNote"))}</p>
   <div class="kpis"><div class="kpi"><b class="mono">87</b><span>${esc(t("buyers"))}</span></div><div class="kpi"><b class="mono">${64+S.fav.length}</b><span>${esc(t("shortlists"))}</span></div><div class="kpi"><b class="mono">${19+Object.values(S.asked).flat().length}</b><span>${esc(t("questions"))}</span></div></div>
   <section class="sec" style="margin-top:14px"><h3>${esc(t("mostWatched"))}</h3><div class="bars">${bars}</div></section>
   <section class="sec" style="margin-top:14px"><h3>${esc(t("topQ"))}</h3><ol class="topq" style="margin:0;padding-left:20px">${qs.map(q=>`<li>${esc(q)}</li>`).join("")}</ol></section>`;
}
function sheet(l){
  const fav=S.fav.includes(l.lot), inCmp=S.cmp.includes(l.lot);
  const asked=(S.asked[l.lot]||[]).map(q=>`<div class="q"><b>${esc(q)}</b><div class="pend">${esc(t("pending"))}</div></div>`).join("");
  const qa=l.qa.map(x=>`<div class="q"><b>${esc(x.q)}</b><div class="a"><span>${esc(t("yolandi"))}</span>${esc(x.a)}</div></div>`).join("");
  const share=t("shareText")(l);
  return `<div class="grab"><div><div class="cname">Lot ${l.lot} · ${esc(l.name)}</div><div class="cid mono">${esc(l.id)}</div></div><button class="close" data-close>${esc(t("close"))}</button></div>
   ${vid(l)}
   <div class="row"><button class="btn ${fav?"primary":""}" data-fav="${l.lot}" aria-pressed="${fav}">${fav?"♥":"♡"} ${esc(t("mine"))}</button>
   <button class="btn" data-cmp="${l.lot}">${esc(inCmp?t("compareRemove"):t("compareAdd"))}</button></div>
   <div class="watch">${esc(t("watching")(watchers(l)))}</div>
   <section class="sec"><h3>${esc(t("pedigree"))}</h3><div class="ped">
    <div><i>${t("age")}</i>${esc(l.age)}</div><div><i>${t("weight")}</i><span class="mono">${esc(l.w)}</span></div>
    <div><i>${t("status")}</i>${esc(stTxt(l))}</div><div><i>Kleur / Colour</i>${esc(l.colour)}</div>
    ${l.scrotal?`<div class="full"><i>Skrotumomtrek / Scrotal</i><span class="mono">${esc(l.scrotal)}</span></div>`:""}
    <div class="full"><i>${t("sire")}</i><span class="mono">${esc(l.sire)}</span></div><div class="full"><i>${t("dam")}</i><span class="mono">${esc(l.dam)}</span></div></div></section>
   <section class="sec"><h3>${esc(t("notes"))}</h3><p class="hint">${esc(t("notesHint"))}</p>
    <textarea id="note-${l.lot}" rows="3" placeholder="${esc(t("notePh"))}">${esc(S.notes[l.lot]||"")}</textarea><div class="saved" id="saved"></div></section>
   <section class="sec"><h3>${esc(t("ask"))}</h3><p class="hint">${esc(t("askHint"))}</p><div class="qa">${qa}${asked}</div>
    <input type="text" id="ask-${l.lot}" placeholder="${esc(t("askPh"))}"><div class="row"><button class="btn primary" data-ask="${l.lot}">${esc(t("send"))}</button></div></section>
   <section class="sec"><h3>${esc(t("share"))}</h3><div class="sharebox" id="shareTxt">${esc(share)}</div>
    <div class="row"><a class="btn wa" href="https://wa.me/?text=${encodeURIComponent(share)}" target="_blank" rel="noopener" style="text-decoration:none">${esc(t("share"))}</a><button class="btn" data-copy>${esc(t("copy"))}</button></div></section>`;
}
function compare(){
  const [a,b]=S.cmp.map(n=>LOTS.find(l=>l.lot===n));
  const kg=s=>parseInt(s);
  const row=(lab,x,y,win)=>`<tr><th>${esc(lab)}</th><td class="${win==="a"?"win":""}">${esc(x)}</td><td class="${win==="b"?"win":""}">${esc(y)}</td></tr>`;
  const wWin=kg(a.w)>kg(b.w)?"a":kg(b.w)>kg(a.w)?"b":"";
  const wa=watchers(a),wb=watchers(b);
  return `<div class="grab"><div class="cname">${esc(t("compareTitle"))}</div><button class="close" data-close>${esc(t("close"))}</button></div>
   <div style="overflow-x:auto"><table class="ctable"><tr><th></th><td><b>Lot ${a.lot}<br>${esc(a.name)}</b></td><td><b>Lot ${b.lot}<br>${esc(b.name)}</b></td></tr>
   ${row(t("age"),a.age,b.age)}${row(t("weight"),a.w,b.w,wWin)}${row(t("status"),stTxt(a),stTxt(b))}${row("Kleur / Colour",a.colour,b.colour)}
   ${row(t("sire"),a.sire,b.sire)}${row(t("dam"),a.dam,b.dam)}${row(t("navList"),String(wa),String(wb),wa>wb?"a":wb>wa?"b":"")}</table></div>`;
}

function render(){
  document.documentElement.lang=S.lang;
  $("#t-title").textContent=t("title");$("#t-demo").textContent=t("demo");
  $("#lang-af").setAttribute("aria-pressed",S.lang==="af");$("#lang-en").setAttribute("aria-pressed",S.lang==="en");
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));
  document.querySelectorAll(".nav [data-tab]").forEach(b=>{if(b.dataset.tab===S.tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  const lb=$("#listBadge");lb.hidden=!S.fav.length;lb.textContent=S.fav.length;
  $("#view").innerHTML={cat:catalogue,list:myList,live:live,dash:dash}[S.tab]();
  const tr=$("#tray");tr.hidden=S.cmp.length<1;$("#cmpBtn").textContent=S.cmp.length===2?t("compareN")(2):t("compareN")(S.cmp.length)+" (1/2)";
}
let openLot=null;
function openSheet(html){$("#sheetIn").innerHTML=html;$("#sheet").hidden=false;$("#scrim").hidden=false;$("#sheet").scrollTop=0}
function closeSheet(){$("#sheet").hidden=true;$("#scrim").hidden=true;openLot=null}
function refreshSheet(){if(openLot!=null)openSheet(sheet(LOTS.find(l=>l.lot===openLot)))}

document.addEventListener("click",e=>{
  const el=e.target.closest("button,[data-close]");if(!el)return;
  if(el.id==="lang-af"||el.id==="lang-en"){S.lang=el.id.slice(5);save();render();refreshSheet();return}
  if(el.dataset.tab){S.tab=el.dataset.tab;render();window.scrollTo(0,0);return}
  if(el.dataset.filter){S.filter=el.dataset.filter;render();return}
  if(el.dataset.fav){const n=+el.dataset.fav;S.fav=S.fav.includes(n)?S.fav.filter(x=>x!==n):[...S.fav,n];save();render();refreshSheet();return}
  if(el.dataset.open){openLot=+el.dataset.open;openSheet(sheet(LOTS.find(l=>l.lot===openLot)));return}
  if(el.hasAttribute("data-close")){closeSheet();return}
  if(el.hasAttribute("data-play")){el.classList.remove("playing");void el.offsetWidth;el.classList.add("playing");return}
  if(el.dataset.cmp){const n=+el.dataset.cmp;if(S.cmp.includes(n))S.cmp=S.cmp.filter(x=>x!==n);else{S.cmp=[...S.cmp,n].slice(-2)}render();refreshSheet();return}
  if(el.id==="cmpBtn"){if(S.cmp.length===2){openLot=null;openSheet(compare())}else{closeSheet();S.tab="cat";render()}return}
  if(el.dataset.ask){const n=+el.dataset.ask,inp=$("#ask-"+n),v=inp.value.trim();if(!v)return;(S.asked[n]=S.asked[n]||[]).push(v);save();refreshSheet();return}
  if(el.hasAttribute("data-copy")){const txt=$("#shareTxt").textContent;const done=()=>{el.textContent=t("copied")};
    try{navigator.clipboard.writeText(txt).then(done,()=>{selectTxt();});}catch(err){selectTxt()}return}
});
function selectTxt(){const r=document.createRange();r.selectNodeContents($("#shareTxt"));const s=getSelection();s.removeAllRanges();s.addRange(r)}
$("#scrim").addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
let noteTimer;
document.addEventListener("input",e=>{if(e.target.id&&e.target.id.startsWith("note-")){const n=+e.target.id.slice(5);S.notes[n]=e.target.value;clearTimeout(noteTimer);noteTimer=setTimeout(()=>{save();const s=$("#saved");if(s)s.textContent=t("saved")},400)}});
// live bid ticker
setInterval(()=>{const b=$("#bid");if(!b)return;const v=parseInt(b.textContent.replace(/\D/g,""));if(v<260000)b.textContent="R"+(v+5000).toLocaleString("en-ZA").replace(/,/g," ")},2500);
render();
</script>

</body></html>
